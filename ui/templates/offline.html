<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — DocScreen AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon-wrap {
      width: 80px; height: 80px;
      background: #eff6ff;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 2.5rem;
    }
    h1 { font-size: 1.4rem; color: #0f172a; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 0.9rem; color: #64748b; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 9999px;
      padding: 14px 32px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(37,99,235,0.3);
    }
    .status { margin-top: 16px; font-size: 0.78rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">📡</div>
    <h1>You're Offline</h1>
    <p>DocScreen AI requires a connection to the screening server to process documents. Please check your network and try again.</p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Retry Connection
    </button>
    <div class="status">DocScreen AI — MEA Border Security Platform</div>
  </div>
</body>
</html>
